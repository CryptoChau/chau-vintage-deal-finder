name: CHAU PSA Vintage Deal Finder

# Laeuft alle 2 Stunden (versetzt zu den beiden bestehenden Workflows, die auf Minute 6 und 36
# laufen) und postet PSA-gegradete (PSA 1-10) Vintage-Pokemon-Einzelkarten-Deals von eBay.ch in
# Discord (#psa-vintage-deals) ueber DISCORD_WEBHOOK_PSA. Kein BGS/CGC/ungegradet.
# Nur ein manueller workflow_dispatch mit post_to_vintage=true schickt stattdessen an
# #ebay-vintage-deals ueber DISCORD_WEBHOOK_HOLO. Schedules bleiben beim PSA-Webhook.
on:
  schedule:
    - cron: "21 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen (kein Discord-Post, kein State-Commit)"
        type: boolean
        default: false
      post_to_vintage:
        description: "Manuell: an #ebay-vintage-deals (DISCORD_WEBHOOK_HOLO) statt #psa-vintage-deals. Schedules ignorieren das."
        type: boolean
        default: false

concurrency:
  group: psa-deal-finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  find-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tesseract-ocr
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run PSA deal finder (xvfb = virtueller Bildschirm fuer echten Headed-Chromium)
        env:
          # Schedule und normaler Handlauf: DISCORD_WEBHOOK_PSA.
          # post_to_vintage gilt nur fuer workflow_dispatch und legt denselben
          # Script-Namen auf DISCORD_WEBHOOK_HOLO. Der Wert wird nicht ausgegeben.
          DISCORD_WEBHOOK_PSA: ${{ (github.event_name == 'workflow_dispatch' && inputs.post_to_vintage == true) && secrets.DISCORD_WEBHOOK_HOLO || secrets.DISCORD_WEBHOOK_PSA }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then ARGS="--dry-run"; fi
          xvfb-run -a --server-args="-screen 0 1280x900x24" python psa_vintage_deal_finder.py $ARGS

      - name: Persist psa_state.json
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        run: |
          git config user.name "chau-deal-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          sh scripts/persist_branch_state.sh psa_state.json "Update PSA state [skip ci]"
