name: CHAU Booster Pack Deal Finder

# Laeuft alle 2 Stunden (versetzt zum Vintage-Finder) und postet Booster-Pack-Deals von
# eBay.ch UND Ricardo.ch (Vintage bis moderne beliebte Sets) in Discord
# (#booster-pack-deals). Cardmarket ist bewusst NICHT dabei - Cloudflare-Challenge laesst
# sich auch mit echtem Headed-Chromium nicht loesen (getestet 2026-09-26).
on:
  schedule:
    - cron: "36 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen (kein Discord-Post, kein State-Commit)"
        type: boolean
        default: false
      test_limit:
        description: "Nur die ersten N Sets pruefen (0 = alle, fuer schnelle Tests)"
        type: string
        default: "0"

concurrency:
  group: booster-deal-finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  find-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run booster deal finder (xvfb = virtueller Bildschirm fuer echten Headed-Chromium)
        env:
          DISCORD_WEBHOOK_BOOSTER: ${{ secrets.DISCORD_WEBHOOK_BOOSTER }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          BOOSTER_TEST_LIMIT: ${{ inputs.test_limit }}
        run: |
          ARGS=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then ARGS="--dry-run"; fi
          if [ "$BOOSTER_TEST_LIMIT" = "0" ]; then unset BOOSTER_TEST_LIMIT; fi
          xvfb-run -a --server-args="-screen 0 1280x900x24" python booster_deal_finder.py $ARGS

      - name: Persist booster_state.json
        run: |
          git config user.name "chau-deal-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          cp booster_state.json /tmp/state_fresh.json 2>/dev/null || true
          git add booster_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update booster state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, retrying ($i/5) ..."
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state_fresh.json booster_state.json 2>/dev/null || true
            git add booster_state.json 2>/dev/null || true
            git diff --cached --quiet || git commit -m "Update booster state [skip ci]"
          done
          echo "Push failed after 5 retries" >&2
          exit 1
