name: CHAU Vintage Deal Finder

# Laeuft alle 2 Stunden und postet nur bestaetigte Vintage-Deals in #ebay-vintage-deals.
# Zeiten im Post sind Europe/Zurich. Geschaetzter Versand und Angebots-Mediane werden nicht gepostet.
# dry_run postet nicht und schreibt keinen State.
#
# eBay blockt echten Headless-Chrome (getestet 2026-09-26 LOKAL: urllib, curl, Playwright
# headless=True, Chrome "--headless=new" und sogar camoufox headless liefern alle nur eine
# leere Fehlerseite/Stub). Nur ein "echter" (headed) Chromium-Prozess funktioniert lokal -
# deshalb xvfb-run: startet einen virtuellen X-Server, damit Chromium ganz normal "headed"
# (ohne --headless-Flag) starten kann, ohne dass ein echter Bildschirm noetig ist. Ob das auch
# von einer GitHub-Actions-Runner-IP aus klappt, ist Stand 2026-09-26 noch nicht verifiziert
# (erster workflow_dispatch-Testlauf steht aus) - dry_run-Input erlaubt einen Test ganz ohne
# Discord-Webhook.
on:
  schedule:
    - cron: "6 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen (kein Discord-Post, kein State-Commit)"
        type: boolean
        default: false
      query_filter:
        description: "Nur Suchen mit diesen Teilstrings (kommagetrennt, z.B. 'gold star,flashfire'); leer = alle"
        type: string
        default: ""

concurrency:
  group: vintage-deal-finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  find-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # seit 2026-11-08 ca. 105 Suchen (Aeren bis 2016) statt 23, Lauf dauert ca. 12-18 Min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run deal finder (xvfb = virtueller Bildschirm fuer echten Headed-Chromium)
        env:
          DISCORD_WEBHOOK_HOLO: ${{ secrets.DISCORD_WEBHOOK_HOLO }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          VINTAGE_QUERY_FILTER: ${{ inputs.query_filter }}
        run: |
          ARGS=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then ARGS="--dry-run"; fi
          xvfb-run -a --server-args="-screen 0 1280x900x24" python vintage_deal_finder.py $ARGS

      - name: Persist deal_state.json
        run: |
          git config user.name "chau-deal-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          # Push state only to the branch that triggered this run.
          # A rejected push retries that same branch. It does not reset to main.
          sh scripts/persist_branch_state.sh deal_state.json "Update state [skip ci]"
