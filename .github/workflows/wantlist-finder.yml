name: CHAU Wunschlisten-Finder

# Sucht Karten aus wantlist.json auf eBay.ch/.de/.com und Ricardo und postet neue Angebote
# mit CHF-Gesamtpreis (inkl. geschaetzter Einfuhrabgaben) in Discord (#wunschliste-deals).
on:
  schedule:
    - cron: "51 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen (kein Discord-Post, kein State-Commit)"
        type: boolean
        default: false

concurrency:
  group: wantlist-finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run wantlist finder (xvfb = virtueller Bildschirm fuer echten Headed-Chromium)
        env:
          DISCORD_WEBHOOK_WANTLIST: ${{ secrets.DISCORD_WEBHOOK_WANTLIST }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then ARGS="--dry-run"; fi
          xvfb-run -a --server-args="-screen 0 1280x900x24" python wantlist_finder.py $ARGS

      - name: Persist wantlist_state.json
        run: |
          git config user.name "chau-deal-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          cp wantlist_state.json /tmp/state_fresh.json 2>/dev/null || true
          git add wantlist_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update wantlist state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, retrying ($i/5) ..."
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/state_fresh.json wantlist_state.json 2>/dev/null || true
            git add wantlist_state.json 2>/dev/null || true
            git diff --cached --quiet || git commit -m "Update wantlist state [skip ci]"
          done
          echo "Push failed after 5 retries" >&2
          exit 1
